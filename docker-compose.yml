#http
version: "3.8"

services:
  app:
    image: ghcr.io/mahn-ke/kiosk-39c3-by-vincent:latest@sha256:12ce1ae5f3a050c8831471b6451a0bdeff74c8112220895529e127d8f7949271
    restart: on-failure:5
    environment:
      - PORT=3011
    ports:
      - "3011:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 5
